<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSERI 성과 등록 프로토타입 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F6F6F2; --surface:#FFFFFF; --surface-2:#EFEFE9;
    --ink:#1C1F24; --ink-muted:#6B7280; --border:#E1E1DA;
    --primary:#1F4E5F; --primary-dark:#153746; --primary-tint:#E7EFF1;
    --sage:#6B8F71; --sage-tint:#EDF3EE;
    --gold:#B8863B; --gold-tint:#F7EFDF;
    --danger:#B3432F; --danger-tint:#FBEAE6;
    --purple:#6E5A9E; --purple-tint:#EFEBF7;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
  .sidebar{background:var(--primary-dark);color:#F1F4F5;padding:26px 18px;display:flex;flex-direction:column;gap:24px;}
  .brand{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;line-height:1.4;}
  .brand small{display:block;font-family:'Noto Sans KR',sans-serif;font-weight:400;font-size:11px;color:#9FB3BB;margin-top:4px;}
  .nav{display:flex;flex-direction:column;gap:3px;}
  .nav button{all:unset;cursor:pointer;padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;color:#CBD8DB;display:flex;align-items:center;gap:9px;transition:background .15s;}
  .nav button:hover{background:#ffffff10;}
  .nav button.active{background:#ffffff14;color:#fff;}
  .nav .dot{width:6px;height:6px;border-radius:50%;background:#5A7580;}
  .nav button.active .dot{background:var(--gold);}
  .whoami{margin-top:auto;border-top:1px solid #ffffff1f;padding-top:16px;font-size:11.5px;color:#9FB3BB;line-height:1.7;}
  .whoami b{color:#fff;display:block;font-size:13px;margin-bottom:2px;}
  .main{padding:32px 40px;max-width:1040px;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-family:'Noto Serif KR',serif;font-size:22px;margin:0 0 5px;}
  .page-head p{margin:0;color:var(--ink-muted);font-size:13px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .type-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
  .type-tab{all:unset;cursor:pointer;padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--border);color:var(--ink-muted);background:var(--surface);transition:all .15s;}
  .type-tab:hover{border-color:var(--primary);color:var(--primary);}
  .type-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .section-title{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--primary);text-transform:uppercase;margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--border);}
  .section-title:first-of-type{border-top:none;padding-top:0;margin-top:4px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;font-weight:600;color:var(--ink);}
  .field label .req{color:var(--danger);margin-left:2px;}
  .field .hint{font-size:11px;color:var(--ink-muted);margin-top:-1px;}
  input[type=text],input[type=date],input[type=number],select,textarea{
    font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#FCFCFA;color:var(--ink);outline:none;transition:border-color .15s,background .15s;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--primary);background:#fff;}
  input.invalid,select.invalid{border-color:var(--danger);background:var(--danger-tint);}
  input.prefill{color:#9AA0A6;font-style:italic;}
  input.prefill:focus{color:var(--ink);font-style:normal;}
  textarea{min-height:64px;resize:vertical;font-family:inherit;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .checkbox-row{display:flex;align-items:center;gap:7px;font-size:13px;}
  .checkbox-row input{width:14px;height:14px;accent-color:var(--primary);}
  .yn-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;width:fit-content;}
  .yn-toggle button{all:unset;cursor:pointer;padding:7px 16px;font-size:12.5px;font-weight:600;color:var(--ink-muted);}
  .yn-toggle button.on{background:var(--sage-tint);color:var(--primary-dark);}
  .yn-toggle button+button{border-left:1px solid var(--border);}

  .chip-group{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;font-size:12px;cursor:pointer;background:#FCFCFA;color:var(--ink-muted);user-select:none;}
  .chip input{accent-color:var(--sage);}
  .chip.checked{background:var(--sage-tint);border-color:var(--sage);color:var(--primary-dark);font-weight:600;}
  .chip.special{background:var(--purple-tint);border-color:var(--purple);color:#3E3266;}
  .other-count{width:56px !important;padding:5px 8px !important;font-size:12px !important;}

  /* name-tag list */
  .nametoggle{border:1px dashed var(--border);border-radius:8px;padding:10px;background:#FBFBF9;}
  .nametoggle-input-row{display:flex;gap:8px;margin-bottom:8px;}
  .nametoggle-input-row input{flex:1;}
  .nametoggle-input-row button{all:unset;cursor:pointer;padding:8px 14px;background:var(--primary);color:#fff;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .nametoggle-list{display:flex;flex-direction:column;gap:6px;}
  .nametoggle-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:7px;padding:6px 8px 6px 12px;}
  .nametoggle-row .nm{font-size:13px;font-weight:500;}
  .nametoggle-row .yn-toggle button{padding:5px 11px;font-size:11.5px;}
  .icon-btn{all:unset;cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--ink-muted);font-size:14px;}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .nametoggle-empty{font-size:11.5px;color:var(--ink-muted);padding:6px 2px;}

  /* upload slots */
  .upload-slot{display:grid;grid-template-columns:1fr 170px auto;gap:8px;align-items:center;background:#FBFBF9;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .upload-slot input[type=file]{font-size:11.5px;}
  .add-slot-btn{all:unset;cursor:pointer;font-size:12px;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:6px;margin-top:2px;}
  .pdf-note{font-size:11px;color:var(--ink-muted);margin-top:6px;}

  .filename-preview{margin-top:20px;border-radius:10px;padding:14px 16px;background:var(--gold-tint);border:1px solid #E4CFA1;display:flex;flex-direction:column;gap:5px;}
  .filename-preview .fp-label{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--gold);text-transform:uppercase;}
  .filename-preview .fp-value{font-size:13.5px;font-weight:600;color:#5B4419;word-break:break-all;}
  .filename-preview .fp-hint{font-size:11px;color:#8A6C33;}

  .calc-box{display:flex;gap:14px;margin-top:16px;}
  .calc-chip{flex:1;background:var(--primary-tint);border-radius:8px;padding:10px 12px;}
  .calc-chip .cl{font-size:10.5px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.03em;}
  .calc-chip .cv{font-size:17px;font-weight:700;color:var(--primary-dark);font-family:'IBM Plex Mono',monospace;margin-top:2px;}

  .submit-row{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;}
  .btn{all:unset;cursor:pointer;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{color:var(--ink-muted);}
  .btn-ghost:hover{color:var(--ink);}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--primary-dark);color:#fff;padding:12px 17px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:320px;}
  .toast.show{opacity:1;transform:translateY(0);}

  .filters{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap;}
  .filters select,.filters input{font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:#fff;}
  .filters input{flex:1;min-width:170px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:left;font-size:11px;color:var(--ink-muted);font-weight:600;padding:0 10px 9px;border-bottom:1px solid var(--border);}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tbody tr:hover{background:#FAFAF7;}
  .tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:600;background:var(--primary-tint);color:var(--primary-dark);}
  .biz-tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;background:var(--sage-tint);color:#3E5C43;margin:2px 3px 0 0;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-muted);}
  .empty-state .glyph{font-size:26px;margin-bottom:8px;}
  .count-badge{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-muted);margin-bottom:12px;}

  /* guide page */
  .guide-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .guide-tab{all:unset;cursor:pointer;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-muted);border:1px solid var(--border);}
  .guide-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .guide-body h3{font-size:14px;color:var(--primary-dark);margin:22px 0 8px;}
  .guide-body h3:first-child{margin-top:0;}
  .guide-body p{font-size:13px;line-height:1.7;margin:0 0 8px;}
  .ack-block{background:#FBFBF9;border:1px dashed var(--border);border-radius:8px;padding:12px 14px;margin:10px 0 16px;font-size:12.5px;line-height:1.8;}
  .ack-block b{color:var(--primary-dark);}
  .guide-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 18px;table-layout:fixed;}
  .guide-table th{background:var(--primary-tint);color:var(--primary-dark);text-align:left;padding:8px 10px;font-size:11px;font-weight:700;border-bottom:1px solid var(--border);}
  .guide-table td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.65;word-break:keep-all;}
  .guide-table td.num{color:var(--ink-muted);width:28px;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .guide-table tr:last-child td{border-bottom:1px solid var(--border);}
  .guide-table.narrow td:first-child, .guide-table.narrow th:first-child{width:130px;font-weight:600;color:var(--primary-dark);}
</style>
</head>
<body>
<div id="identify-gate" style="position:fixed;inset:0;background:#F6F6F2;z-index:50;display:flex;align-items:center;justify-content:center;">
  <div style="background:#fff;border:1px solid #E1E1DA;border-radius:12px;padding:36px 34px;max-width:360px;width:90%;text-align:center;">
    <div style="font-family:'Noto Serif KR',serif;font-weight:700;font-size:18px;color:#1F4E5F;margin-bottom:6px;">CSERI 성과관리</div>
    <p style="font-size:13px;color:#6B7280;margin:0 0 20px;">구성원명단에 등록된 이메일을 입력해주세요.</p>
    <input type="text" id="gate-email" placeholder="you@sungshin.ac.kr" style="width:100%;padding:10px 12px;border:1px solid #E1E1DA;border-radius:7px;font-size:13.5px;margin-bottom:10px;">
    <button id="gate-confirm" style="all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:11px;background:#1F4E5F;color:#fff;border-radius:8px;font-size:13.5px;font-weight:600;text-align:center;">확인</button>
    <p id="gate-error" style="display:none;color:#B3432F;font-size:12px;margin-top:10px;">구성원명단에 없는 이메일입니다. 관리자에게 등록을 요청해주세요.</p>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">CSERI 성과관리<small>융합보안공학연구소 · 프로토타입 v2</small></div>
    <nav class="nav">
      <button id="nav-guide"><span class="dot"></span>이용 안내</button>
      <button id="nav-form" class="active"><span class="dot"></span>성과 등록</button>
      <button id="nav-list"><span class="dot"></span>성과 목록</button>
    </nav>
    <div class="whoami"><b id="whoami-name">-</b><span id="whoami-degree"></span> · <a href="#" id="whoami-switch" style="color:#9FB3BB;text-decoration:underline;">계정 전환</a><br><span class="mono" style="font-size:10.5px" id="whoami-email"></span></div>
  </aside>

  <main class="main">
    <section id="page-form">
      <div class="page-head">
        <h1>성과 등록</h1>
        <p>유형을 선택하면 필요한 항목만 표시됩니다.</p>
      </div>
      <div class="card">
        <div class="type-tabs" id="type-tabs"></div>
        <div id="form-body"></div>
        <div class="filename-preview" id="fp-box">
          <span class="fp-label">자동 생성 파일명</span>
          <span class="fp-value" id="fp-value">항목을 입력하면 파일명이 여기에 표시됩니다</span>
          <span class="fp-hint" id="fp-hint"></span>
        </div>
        <div class="submit-row">
          <button class="btn btn-ghost" id="reset-btn">초기화</button>
          <button class="btn btn-primary" id="submit-btn">성과 등록</button>
        </div>
      </div>
    </section>

    <section id="page-list" style="display:none">
      <div class="page-head"><h1>성과 목록</h1><p>등록된 성과를 유형·사업별로 필터링하고 검색할 수 있습니다.</p></div>
      <div class="card">
        <div class="filters">
          <select id="f-type"><option value="">전체 유형</option></select>
          <select id="f-biz"><option value="">전체 사업</option></select>
          <input id="f-search" type="text" placeholder="제목 · 작성자 검색">
          <button class="btn btn-primary" id="download-btn" style="padding:8px 14px;font-size:12.5px;flex:none;white-space:nowrap;">⬇ 엑셀 다운로드</button>
        </div>
        <div class="count-badge" id="list-count"></div>
        <div id="list-wrap"></div>
      </div>
    </section>

    <section id="page-guide" style="display:none">
      <div class="page-head"><h1>이용 안내</h1><p>성과 등록 방법과 사사표기 방법을 확인하세요.</p></div>
      <div class="card">
        <div class="guide-tabs">
          <button class="guide-tab active" data-g="reg">성과 등록 방법</button>
          <button class="guide-tab" data-g="evidence">증빙자료 안내</button>
          <button class="guide-tab" data-g="ack">사사표기 방법</button>
        </div>
        <div class="guide-body" id="guide-body"></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast">등록되었습니다</div>

<script>
/* ============ 공통 상수 ============ */
const BIZ_FULL = ['첨단산업','ICT혁신인재','에어갭','중견연구','콘텐츠 디지털포렌식','정보보호특성화(수혜)','기술보호(수혜)','기타'];
const BIZ_AWARD = ['첨단산업','ICT혁신인재','에어갭','중견연구','콘텐츠 디지털포렌식','기술보호'];
const BIZ_CERT = ['첨단산업','ICT혁신인재','에어갭','중견연구','콘텐츠 디지털포렌식','기술보호'];
const BIZ_INTERN = ['첨단산업','ICT혁신인재','에어갭','중견연구','콘텐츠 디지털포렌식','정보보호특성화(수혜)'];
const BIZ_PATENT = ['첨단산업','ICT혁신인재','에어갭','중견연구','콘텐츠 디지털포렌식','정보보호특성화(수혜)','기타'];
const NONCOUNT = ['정보보호특성화(수혜)','기술보호(수혜)']; // ACK 집계 제외
const DEGREES = ['학사과정','석사과정','박사과정','박사후연구원'];

/* ============ API 연동 (GitHub Pages -> GAS fetch) ============ */
const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbzLK_c6C8nXQbm2TpOytjrzYhjTCFkcfE8GtFpjIa5YMklf_lD327Yv9GnHbDfJuQHWKQ/exec'; // 배포된 GAS 웹앱의 /exec 주소로 교체하세요
let currentMember = null; // { name, email, degree }

function apiCall(action, extra){
  const body = Object.assign({ action }, extra);
  return fetch(API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS 프리플라이트 회피
    body: JSON.stringify(body),
  }).then(r => r.json());
}

function showGate(errorMsg){
  document.getElementById('identify-gate').style.display = 'flex';
  const err = document.getElementById('gate-error');
  if(errorMsg){ err.textContent = errorMsg; err.style.display = 'block'; } else { err.style.display = 'none'; }
}
function hideGate(){ document.getElementById('identify-gate').style.display = 'none'; }

function applyMember(member){
  currentMember = member;
  document.getElementById('whoami-name').textContent = member.name;
  document.getElementById('whoami-degree').textContent = member.degree || '';
  document.getElementById('whoami-email').textContent = member.email;
  localStorage.setItem('cseri_member_email', member.email);
  hideGate();
}

document.getElementById('gate-confirm').addEventListener('click', ()=>{
  const email = document.getElementById('gate-email').value.trim();
  if(!email){ showGate('이메일을 입력해주세요.'); return; }
  apiCall('verifyMember', { email }).then(res=>{
    if(res.found){ applyMember(res); }
    else { showGate('구성원명단에 없는 이메일입니다. 관리자에게 등록을 요청해주세요.'); }
  }).catch(()=> showGate('서버에 연결할 수 없습니다. API_BASE_URL 설정을 확인해주세요.'));
});
document.getElementById('whoami-switch').addEventListener('click', (e)=>{
  e.preventDefault();
  localStorage.removeItem('cseri_member_email');
  document.getElementById('gate-email').value = '';
  showGate();
});

// 저장된 이메일이 있으면 자동으로 재확인 시도, 없으면 게이트 표시
(function initGate(){
  const saved = localStorage.getItem('cseri_member_email');
  if(saved){
    document.getElementById('gate-email').value = saved;
    apiCall('verifyMember', { email: saved }).then(res=>{
      if(res.found) applyMember(res); else showGate();
    }).catch(()=> showGate('서버에 연결할 수 없습니다. API_BASE_URL 설정을 확인해주세요.'));
  } else {
    showGate();
  }
})();

/* ============ 상태 ============ */
let currentType = 'journal';
let entries = [];
let sessionCount = 0;
let uploads = []; // {docType, fileName}

/* ============ 유틸 ============ */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function showToast(msg, isError){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.background=isError?'var(--danger)':'var(--primary-dark)';
  t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),2800);
}

/* ============ 이름태그+특성화토글 컴포넌트 ============ */
function createNameToggle(containerId, opts={}){
  const wrap = document.getElementById(containerId);
  let data = [];
  function render(){
    wrap.innerHTML='';
    const inputRow = el('div','nametoggle-input-row');
    const input = document.createElement('input'); input.type='text'; input.placeholder=opts.placeholder||'이름 입력 후 추가';
    const addBtn = document.createElement('button'); addBtn.textContent='+ 추가';
    function addName(){
      const v=input.value.trim(); if(!v) return;
      data.push({name:v, special:null});
      input.value='';
      render(); updateAll();
    }
    addBtn.onclick = addName;
    input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addName(); } };
    inputRow.appendChild(input); inputRow.appendChild(addBtn);
    wrap.appendChild(inputRow);

    const list = el('div','nametoggle-list');
    if(data.length===0){
      list.appendChild(el('div','nametoggle-empty', opts.emptyText || '아직 추가된 이름이 없습니다'));
    }
    data.forEach((d,idx)=>{
      const row = el('div','nametoggle-row');
      row.appendChild(el('div','nm', d.name));
      if(opts.toggle !== false){
        const yn = el('div','yn-toggle');
        const yBtn = document.createElement('button'); yBtn.textContent='특성화 해당'; yBtn.className = d.special===true?'on':'';
        const nBtn = document.createElement('button'); nBtn.textContent='비해당'; nBtn.className = d.special===false?'on':'';
        yBtn.onclick=()=>{ d.special=true; render(); updateAll(); };
        nBtn.onclick=()=>{ d.special=false; render(); updateAll(); };
        yn.appendChild(yBtn); yn.appendChild(nBtn);
        row.appendChild(yn);
      } else {
        row.appendChild(el('div'));
      }
      const rm = el('button','icon-btn','✕');
      rm.onclick=()=>{ data.splice(idx,1); render(); updateAll(); };
      row.appendChild(rm);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }
  render();
  return { getData: ()=>data, render };
}

/* ============ 업로드 슬롯 ============ */
function renderUploadSlots(containerId, docTypeOptionsFn){
  const wrap = document.getElementById(containerId);
  function render(){
    wrap.innerHTML='';
    if(uploads.length===0) uploads.push({docType:'', fileName:''});
    const options = docTypeOptionsFn();
    uploads.forEach((u,idx)=>{
      const row = el('div','upload-slot');
      const fileInput = document.createElement('input'); fileInput.type='file'; fileInput.accept='application/pdf';
      fileInput.onchange = (e)=>{ u.file = e.target.files[0] || null; u.fileName = u.file ? u.file.name : ''; };
      const select = document.createElement('select');
      select.innerHTML = '<option value="">문서 종류 선택</option>' + options.map(o=>`<option value="${o}" ${u.docType===o?'selected':''}>${o}</option>`).join('');
      select.onchange=(e)=>{ u.docType = e.target.value; };
      row.appendChild(fileInput); row.appendChild(select);
      if(uploads.length>1){
        const rm = el('button','icon-btn','✕');
        rm.onclick=()=>{ uploads.splice(idx,1); render(); };
        row.appendChild(rm);
      } else {
        row.appendChild(el('div'));
      }
      wrap.appendChild(row);
    });
    const addBtn = el('button','add-slot-btn','+ 파일 추가');
    addBtn.onclick=()=>{ uploads.push({docType:'', fileName:''}); render(); };
    wrap.appendChild(addBtn);
    wrap.appendChild(el('div','pdf-note','업로드 파일은 PDF로 통일해주세요.'));
  }
  render();
  return { render };
}

/* ============ 사사표기(수혜) 사업 칩 ============ */
function renderBizChips(containerId, list, opts={}){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML='';
  const group = el('div','chip-group');
  list.forEach(b=>{
    const isSpecial = b.includes('특성화') || b.includes('기술보호');
    const chip = el('label','chip'+(isSpecial?' ':''));
    if(b==='기타'){
      chip.innerHTML = `<input type="checkbox" value="기타"> 기타(개수) <input type="number" class="other-count" min="0" placeholder="0">`;
      const cb = chip.querySelector('input[type=checkbox]');
      cb.onchange=(e)=>{ chip.classList.toggle('checked', e.target.checked); updateAll(); };
      const num = chip.querySelector('input[type=number]');
      num.oninput = updateAll;
      num.onclick = (e)=>e.stopPropagation();
    } else {
      chip.innerHTML = `<input type="checkbox" value="${b}"> ${b}`;
      const cb = chip.querySelector('input');
      cb.onchange=(e)=>{
        chip.classList.toggle('checked', e.target.checked);
        chip.classList.toggle('special', e.target.checked && isSpecial);
        updateAll();
      };
    }
    group.appendChild(chip);
  });
  wrap.appendChild(group);
}
function collectBiz(containerId){
  const wrap = document.getElementById(containerId);
  const checked = Array.from(wrap.querySelectorAll('.chip input[type=checkbox]:checked')).map(el=>el.value);
  const otherInput = wrap.querySelector('.other-count');
  const otherCount = otherInput ? (parseInt(otherInput.value)||0) : 0;
  return { checked, otherCount };
}
function calcACK(containerId){
  const { checked, otherCount } = collectBiz(containerId);
  const countable = checked.filter(c => !NONCOUNT.includes(c) && c!=='기타').length;
  return countable + otherCount;
}

}
function textInput(id, placeholder){ const i=document.createElement('input'); i.type='text'; i.id=id; if(placeholder) i.placeholder=placeholder; i.oninput=updatePreview; return i; }
function dateInput(id){ const i=document.createElement('input'); i.type='date'; i.id=id; i.onchange=updatePreview; return i; }
function numberInput(id, placeholder){ const i=document.createElement('input'); i.type='number'; i.id=id; if(placeholder) i.placeholder=placeholder; i.oninput=updatePreview; return i; }
function textarea(id){ const t=document.createElement('textarea'); t.id=id; t.oninput=updatePreview; return t; }
function selectInput(id, options, onchange){
  const s=document.createElement('select'); s.id=id;

}

function gval(id){ const e=document.getElementById(id); return e ? e.value.trim() : ''; }
function bizDisplayString(){
  const { checked, otherCount } = collectBiz('biz-wrap');
  const parts = checked.filter(c=>c!=='기타');
  if(checked.includes('기타')) parts.push(`기타(${otherCount||0})`);
  return parts.join(', ');
}
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    if(!file){ resolve(''); return; }
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ 등록 ============ */
document.getElementById('submit-btn').addEventListener('click', ()=>{
  if(!currentMember){ showGate('먼저 이메일을 확인해주세요.'); return; }

  const payload = buildPayload();
  payload.member = { email: currentMember.email };

  const validUploads = uploads.filter(u => u.file && u.docType);
  if(validUploads.length===0){
    showToast('증빙 파일과 문서 종류를 선택해주세요', true);
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '등록 중...';

  Promise.all(validUploads.map(u =>
    fileToBase64(u.file).then(b64 => ({ docType: u.docType, fileName: u.file.name, base64: b64 }))
  )).then(files=>{
    if(currentType==='award'){
      payload.awardUpload = files[0] ? { docType: files[0].docType, base64: files[0].base64 } : null;
    } else {
      payload.uploads = files;
    }

    if(API_BASE_URL.indexOf('PASTE_YOUR')===0){
      // 배포 URL이 아직 설정 안 된 상태 - 로컬 미리보기로 대체
      sessionCount++;
      entries.push({ id: Date.now(), typeKey: currentType, title: document.getElementById('fp-value').textContent, biz: collectBiz('biz-wrap').checked, date: new Date().toISOString().slice(0,10) });
      showToast('성과가 등록되었습니다 (로컬 미리보기 — API_BASE_URL 설정 후 실제 저장됩니다)');
      btn.disabled = false; btn.textContent = '성과 등록';
      renderFields();
      return;
    }

    apiCall('submitAchievement', { payload })
      .then(res=>{
        if(res.success){
          showToast(`성과가 등록되었습니다 (${res.sheetName} #${res.rowNumber}, 증빙 ${res.evidenceCount}건)`);
          renderFields();
        } else {
          showToast('등록 실패: ' + res.error, true);
        }
        btn.disabled = false; btn.textContent = '성과 등록';
      })
      .catch(err=>{
        showToast('등록 실패: ' + err, true);
        btn.disabled = false; btn.textContent = '성과 등록';
      });
  }).catch(err=>{
    showToast('파일 변환 중 오류가 발생했습니다: ' + err, true);
    btn.disabled = false; btn.textContent = '성과 등록';
  });
});

  const search = document.getElementById('f-search').value.trim().toLowerCase();
  return entries.filter(e=>{
    if(typeFilter && e.typeKey!==typeFilter) return false;
    if(bizFilter && !e.biz.some(b => normalizeBiz(b)===bizFilter)) return false;
    if(search && !e.title.toLowerCase().includes(search)) return false;
    return true;
  }).sort((a,b)=> b.date.localeCompare(a.date));
}
function renderList(){
  const filtered = getFilteredEntries();
  document.getElementById('list-count').textContent = `총 ${filtered.length}건`;
  const wrap = document.getElementById('list-wrap');
  if(filtered.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="glyph">＋</div><p>조건에 맞는 성과가 없습니다</p></div>`;
    return;
  }
  wrap.innerHTML = `<table><thead><tr><th style="width:110px">유형</th><th>파일명 미리보기</th><th style="width:200px">사업</th><th style="width:90px">등록일</th></tr></thead><tbody>
    ${filtered.map(e=>`<tr><td><span class="tag">${TYPE_LABELS[e.typeKey]}</span></td><td class="mono" style="font-size:11.5px">${e.title}</td><td>${e.biz.map(b=>`<span class="biz-tag">${b}</span>`).join('')}</td><td>${e.date}</td></tr>`).join('')}
  </tbody></table>`;
}
document.getElementById('f-type').addEventListener('change', renderList);
document.getElementById('f-biz').addEventListener('change', renderList);
document.getElementById('f-search').addEventListener('input', renderList);

document.getElementById('download-btn').addEventListener('click', ()=>{
  const filtered = getFilteredEntries();
  if(filtered.length===0){ showToast('다운로드할 성과가 없습니다', true); return; }
  const rows = filtered.map(e=>({
    '유형': TYPE_LABELS[e.typeKey],
    '파일명 미리보기': e.title,
    '사업': e.biz.join(', '),
    '등록일': e.date,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:50},{wch:36},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '성과목록');
  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `성과목록_${today}.xlsx`);
  showToast(`${filtered.length}건 다운로드되었습니다`);
});
